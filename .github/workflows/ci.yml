name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  check:
    name: Lint · Type · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_SITE_URL: https://kyriewen.cn

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # lint / type-check / build 均覆盖两个应用：
      # 以前 CI 只管主站，admin 的问题一直无人拦。
      - name: Lint (main + admin)
        run: pnpm lint:all

      - name: Type check (main + admin)
        run: pnpm type-check:all

      # 安全不变式回归测试：鉴权、sanitize、fail-closed 行为与结构约束
      - name: Test
        run: pnpm test

      - name: Build main site
        run: pnpm build

      - name: Build admin
        run: pnpm --filter admin build

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    needs: check
    if: github.event_name == 'pull_request'
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://localhost:3000
            http://localhost:3000/projects
            http://localhost:3000/blog
          configPath: ./.lighthouserc.json
          runs: 1
          uploadArtifacts: true
